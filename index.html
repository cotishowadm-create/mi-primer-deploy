<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Dashboard Sucursales - Chuck</title>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <div class="flex justify-between items-center mb-8 bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-500 tracking-tight">Control de Sucursales</h1>
                <p class="text-gray-400 mt-1">Monitoreo en tiempo real vía Railway</p>
            </div>
            <div class="text-right">
                <div class="text-xs uppercase text-gray-500 font-bold">Última actualización</div>
                <div id="reloj" class="text-2xl font-mono text-green-400">--:--:--</div>
            </div>
        </div>

        <!-- Rejilla de Sucursales -->
        <div id="contenedor-sucursales" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Las tarjetas se cargarán aquí automáticamente -->
        </div>

        <div id="error-msg" class="hidden mt-4 p-4 bg-red-900/50 border border-red-500 text-red-200 rounded-lg text-center">
            Error al conectar con el servidor central.
        </div>
    </div>

    <script>
        // REEMPLAZA ESTA URL CON LA TUYA DE RAILWAY
        const URL_API = "https://https://mi-primer-deploy-production.up.railway.app/";

        async function actualizarDashboard() {
            try {
                const response = await fetch(URL_API);
                const data = await response.json();

                const contenedor = document.getElementById('contenedor-sucursales');
                const reloj = document.getElementById('reloj');
                const errorMsg = document.getElementById('error-msg');

                reloj.innerText = data.ultima_actualizacion;
                errorMsg.classList.add('hidden');
                contenedor.innerHTML = ''; // Limpiar para actualizar

                data.detalle_sucursales.forEach(sucursal => {
                    const isOnline = sucursal.status === "Online";
                    
                    const card = `
                        <div class="bg-gray-800 border ${isOnline ? 'border-gray-700' : 'border-red-500/50'} p-5 rounded-xl shadow-md hover:scale-105 transition-transform duration-300">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-gray-400 text-sm">#00${sucursal.id}</span>
                                <span class="flex h-3 w-3">
                                    <span class="animate-ping absolute inline-flex h-3 w-3 rounded-full ${isOnline ? 'bg-green-400' : 'bg-red-400'} opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-3 w-3 ${isOnline ? 'bg-green-500' : 'bg-red-500'}"></span>
                                </span>
                            </div>
                            <h3 class="text-xl font-bold mb-2">${sucursal.nombre}</h3>
                            <p class="text-sm ${isOnline ? 'text-green-400' : 'text-red-400'} font-semibold italic">
                                ${sucursal.status}
                            </p>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        // Actualizar cada 5 segundos
        setInterval(actualizarDashboard, 5000);

        // Primera carga
        actualizarDashboard();
    </script>
</body>
</html>
